<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Cyberflix Systems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            min-height: 100vh;
            padding: 120px 7% 70px;
        }

        .cart-header {
            max-width: 1250px;
            margin: 0 auto 35px;
        }

        .cart-header h1 {
            font-size: clamp(38px, 5vw, 65px);
            margin: 0;
        }

        .cart-header h1 span {
            color: #e10600;
        }

        .cart-header p {
            color: #888;
            margin-top: 10px;
        }

        .cart-layout {
            max-width: 1250px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.5fr 0.75fr;
            gap: 25px;
        }

        .cart-card,
        .cart-summary {
            background: #101010;
            border: 1px solid #242424;
            border-radius: 18px;
            padding: 25px;
        }

        .cart-card h2,
        .cart-summary h2 {
            margin: 0 0 25px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 65px 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 18px 0;
            border-bottom: 1px solid #242424;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .component-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #080808;
            border: 1px solid #303030;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e10600;
            font-weight: 900;
            font-size: 13px;
        }

        .item-category {
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .item-name {
            font-size: 15px;
            font-weight: 700;
        }

        .item-price {
            color: #e10600;
            font-weight: 800;
            white-space: nowrap;
        }

        .cart-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 22px;
            gap: 15px;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
        }

        .clear-btn:hover {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 14px 0;
            font-size: 14px;
        }

        .summary-row span:first-child {
            color: #888;
        }

        .divider {
            height: 1px;
            background: #292929;
            margin: 20px 0;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 800;
        }

        .cart-total span:last-child {
            color: #e10600;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            text-decoration: none;
            background: #e10600;
            color: #050505;
            padding: 16px;
            border-radius: 10px;
            margin-top: 25px;
            font-weight: 900;
            transition: 0.2s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(225,6,0,0.15);
        }

        .back-builder {
            display: block;
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            margin-top: 15px;
        }

        .back-builder:hover {
            color: #e10600;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-cart-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            text-decoration: none;
            background: #e10600;
            color: #050505;
            padding: 13px 25px;
            border-radius: 9px;
            font-weight: 800;
        }

        @media (max-width: 850px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {
            .cart-page {
                padding-left: 5%;
                padding-right: 5%;
            }

            .cart-item {
                grid-template-columns: 50px 1fr;
            }

            .component-icon {
                width: 48px;
                height: 48px;
            }

            .item-price {
                grid-column: 2;
            }

            .cart-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        CYBERFLIX<span>.</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="components.html">Components</a>
        <a href="builder.html">PC Builder</a>
        <a href="#">Custom Builds</a>
        <a href="#">RTX & Deals</a>
    </nav>

    <div class="nav-actions">
        <a href="builder.html">Build PC</a>
    </div>

</header>


<main class="cart-page">

    <div class="cart-header">
        <h1>YOUR CART<span>.</span></h1>
        <p>Review your custom Cyberflix PC before checkout.</p>
    </div>


    <div id="cartContent">

        <div class="cart-layout">

            <!-- CART ITEMS -->

            <section class="cart-card">

                <h2>Build Components</h2>

                <div id="cartItems"></div>

                <div class="cart-actions">

                    <a
                        href="builder.html"
                        class="back-builder"
                        style="margin:0;"
                    >
                        ← Modify Build
                    </a>

                    <button
                        id="clearCart"
                        class="clear-btn"
                    >
                        Clear Build
                    </button>

                </div>

            </section>


            <!-- SUMMARY -->

            <aside class="cart-summary">

                <h2>Cart Summary</h2>

                <div class="summary-row">
                    <span>Components</span>
                    <strong id="componentCount">0</strong>
                </div>

                <div class="summary-row">
                    <span>Build Price</span>
                    <strong id="subtotal">₹0</strong>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <strong>FREE</strong>
                </div>

                <div class="divider"></div>

                <div class="cart-total">
                    <span>Total</span>
                    <span id="cartTotal">₹0</span>
                </div>

                <a
                    href="checkout.html"
                    id="checkoutBtn"
                    class="checkout-btn"
                >
                    PROCEED TO CHECKOUT →
                </a>

                <a
                    href="builder.html"
                    class="back-builder"
                >
                    Continue Building
                </a>

            </aside>

        </div>

    </div>

</main>


<script src="cart.js"></script>

</body>
</html>
