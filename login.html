<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Cyberflix Systems LLP</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border: 1px solid rgba(8, 181, 217, 0.25);
            border-radius: 18px;
            background: rgba(15, 15, 15, 0.95);
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .auth-logo {
            display: block;
            width: 230px;
            max-width: 100%;
            margin: 0 auto 25px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(8,181,217,0.25);
            background: transparent;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-tab.active {
            background: #08B5D9;
            color: #fff;
            border-color: #08B5D9;
        }

        .auth-group {
            margin-bottom: 18px;
        }

        .auth-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #ddd;
        }

        .auth-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            outline: none;
        }

        .auth-group input:focus {
            border-color: #08B5D9;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #08B5D9;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .auth-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.error {
            background: rgba(255, 70, 70, 0.12);
            color: #ff7777;
            border: 1px solid rgba(255,70,70,0.25);
        }

        .auth-message.success {
            background: rgba(8, 181, 217, 0.12);
            color: #08B5D9;
            border: 1px solid rgba(8,181,217,0.25);
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #08B5D9;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 48px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #888;
            cursor: pointer;
        }

        .auth-loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <img
                src="assets/cyberflix-logo.png"
                alt="Cyberflix Systems LLP"
                class="auth-logo"
            >

            <h1 class="auth-title" id="authTitle">
                Welcome Back
            </h1>

            <p class="auth-subtitle" id="authSubtitle">
                Login to your Cyberflix account
            </p>


            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="loginTab"
                >
                    LOGIN
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="registerTab"
                >
                    REGISTER
                </button>

            </div>


            <div
                class="auth-message"
                id="authMessage"
            ></div>


            <form id="authForm">

                <div
                    class="auth-group"
                    id="nameGroup"
                    style="display:none;"
                >

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                </div>


                <div class="auth-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="authSubmit"
                >
                    LOGIN
                </button>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Cyberflix
            </a>

        </section>

    </main>


<script>

const authForm =
    document.getElementById("authForm");

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const nameGroup =
    document.getElementById("nameGroup");

const nameInput =
    document.getElementById("name");

const authTitle =
    document.getElementById("authTitle");

const authSubtitle =
    document.getElementById("authSubtitle");

const authSubmit =
    document.getElementById("authSubmit");

const authMessage =
    document.getElementById("authMessage");

const passwordInput =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");


let mode = "login";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message, type = "error") {

    authMessage.textContent = message;

    authMessage.className =
        "auth-message show " + type;

}


/* =========================================================
   MODE
========================================================= */

function setMode(newMode) {

    mode = newMode;

    authMessage.className =
        "auth-message";


    if (mode === "register") {

        loginTab.classList.remove("active");

        registerTab.classList.add("active");

        nameGroup.style.display = "block";

        nameInput.required = true;

        authTitle.textContent =
            "Create Account";

        authSubtitle.textContent =
            "Create your Cyberflix account";

        authSubmit.textContent =
            "CREATE ACCOUNT";

        passwordInput.autocomplete =
            "new-password";

    } else {

        registerTab.classList.remove("active");

        loginTab.classList.add("active");

        nameGroup.style.display = "none";

        nameInput.required = false;

        authTitle.textContent =
            "Welcome Back";

        authSubtitle.textContent =
            "Login to your Cyberflix account";

        authSubmit.textContent =
            "LOGIN";

        passwordInput.autocomplete =
            "current-password";

    }

}


loginTab.addEventListener(
    "click",
    () => setMode("login")
);


registerTab.addEventListener(
    "click",
    () => setMode("register")
);


/* =========================================================
   PASSWORD
========================================================= */

showPassword.addEventListener(
    "click",
    () => {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPassword.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            showPassword.textContent =
                "👁";

        }

    }
);


/* =========================================================
   AUTH SUBMIT
========================================================= */

authForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        const name =
            nameInput.value.trim();


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;

        }


        if (
            mode === "register" &&
            !name
        ) {

            showMessage(
                "Please enter your full name."
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters."
            );

            return;

        }


        authSubmit.classList.add(
            "auth-loading"
        );

        authSubmit.textContent =
            mode === "login"
                ? "LOGGING IN..."
                : "CREATING ACCOUNT...";


        try {

            const response =
                await fetch(
                    `/api/auth?action=${mode}`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            name:
                                mode === "register"
                                    ? name
                                    : undefined,

                            email,

                            password

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Authentication failed."
                );

            }


            if (data.user) {

                localStorage.setItem(
                    "cyberflixUser",
                    JSON.stringify(
                        data.user
                    )
                );

            }


            showMessage(
                mode === "login"
                    ? "Login successful!"
                    : "Account created successfully!",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);


        } catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to connect to server."
            );


            authSubmit.textContent =
                mode === "login"
                    ? "LOGIN"
                    : "CREATE ACCOUNT";

        } finally {

            authSubmit.classList.remove(
                "auth-loading"
            );

        }

    }
);

</script>

</body>
</html>
