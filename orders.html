<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Orders | Cyberflix Systems LLP"><link rel="stylesheet" href="style.css"></head><body><header class="navbar cyber-nav final-nav"><a class="logo official-logo" href="index.html"><img src="assets/cyberflix-logo.png" alt="Cyberflix Systems LLP"></a><nav class="main-nav"><a href="index.html">Home</a><a href="components.html">Components</a><a href="builder.html">PC Builder</a><a class="active" href="orders.html">Orders</a></nav></header><main class="page-shell"><div class="form-card"><h1>Your Orders</h1><div id="orders"></div></div></main><script>fetch('/api/orders').then(r=>r.ok?r.json():null).then(d=>{const a=document.getElementById('orders');if(!d||!d.orders||!d.orders.length){a.innerHTML='<p style="color:#888;margin-top:15px">Login to view your orders.</p>';return}a.innerHTML=d.orders.map(o=>`<div style="padding:15px 0;border-bottom:1px solid #222"><strong>${o.order_id||o.orderId}</strong><span style="float:right;color:#08B5D9">₹${Number(o.total||0).toLocaleString('en-IN')}</span><div style="color:#777;font-size:12px;margin-top:5px">${new Date(o.created_at||o.date).toLocaleString('en-IN')}</div></div>`).join('')}).catch(()=>{})</script></body></html>
