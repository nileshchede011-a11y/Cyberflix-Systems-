<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Cyberflix Systems</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-page {
            min-height: 100vh;
            padding: 120px 7% 60px;
        }

        .checkout-header {
            margin-bottom: 35px;
        }

        .checkout-header h1 {
            font-size: clamp(35px, 5vw, 65px);
            margin: 0;
        }

        .checkout-header p {
            color: #999;
            margin-top: 10px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.5fr 0.8fr;
            gap: 30px;
            max-width: 1250px;
            margin: auto;
        }

        .checkout-card,
        .summary-card {
            background: #101010;
            border: 1px solid #242424;
            border-radius: 18px;
            padding: 28px;
        }

        .checkout-card h2,
        .summary-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 28px 0 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            color: #aaa;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            background: #080808;
            color: white;
            border: 1px solid #303030;
            border-radius: 10px;
            padding: 14px;
            outline: none;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #08B5D9;
        }

        .payment-options {
            display: grid;
            gap: 12px;
        }

        .payment-option {
            border: 1px solid #303030;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .payment-option:hover {
            border-color: #777;
        }

        .payment-option.active {
            border-color: #08B5D9;
            background: rgba(8,181,217,0.05);
        }

        .payment-option input {
            accent-color: #08B5D9;
            margin-right: 10px;
        }

        .payment-option strong {
            font-size: 14px;
        }

        .payment-option span {
            display: block;
            color: #777;
            font-size: 12px;
            margin: 6px 0 0 25px;
        }

        .summary-items {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 14px;
        }

        .summary-item span:first-child {
            color: #aaa;
        }

        .summary-divider {
            height: 1px;
            background: #292929;
            margin: 20px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
        }

        .summary-total span:last-child {
            color: #08B5D9;
        }

        .place-order-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #08B5D9;
            color: #050505;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(8,181,217,0.15);
        }

        .secure-note {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 15px;
        }

        .empty-checkout {
            text-align: center;
            padding: 70px 20px;
        }

        @media (max-width: 850px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .checkout-page {
                padding-left: 5%;
                padding-right: 5%;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">CYBERFLIX<span>.</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="components.html">Components</a>
            <a href="builder.html">PC Builder</a>
            <a href="#">Custom Builds</a>
            <a href="#">RTX & Deals</a>
        </nav>

        <div class="nav-actions">
            <a href="components.html">← Shop</a>
        </div>
    </header>


    <main class="checkout-page">

        <div class="checkout-header">
            <h1>CHECKOUT<span>.</span></h1>
            <p>Complete your details and place your Cyberflix build order.</p>
        </div>


        <div id="checkoutContent">

            <div class="checkout-layout">

                <!-- CUSTOMER DETAILS -->
                <div class="checkout-card">

                    <h2>Customer Details</h2>

                    <form id="checkoutForm">

                        <div class="section-title">
                            Contact Information
                        </div>

                        <div class="form-grid">

                            <div class="form-group">
                                <label>Full Name</label>
                                <input
                                    type="text"
                                    id="name"
                                    placeholder="Enter your name"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label>Mobile Number</label>
                                <input
                                    type="tel"
                                    id="mobile"
                                    placeholder="10 digit mobile number"
                                    maxlength="10"
                                    required
                                >
                            </div>

                            <div class="form-group full">
                                <label>Email Address</label>
                                <input
                                    type="email"
                                    id="email"
                                    placeholder="you@example.com"
                                    required
                                >
                            </div>

                        </div>


                        <div class="section-title">
                            Delivery Address
                        </div>

                        <div class="form-grid">

                            <div class="form-group full">
                                <label>Address</label>
                                <textarea
                                    id="address"
                                    placeholder="House / Building / Street"
                                    required
                                ></textarea>
                            </div>

                            <div class="form-group">
                                <label>City</label>
                                <input
                                    type="text"
                                    id="city"
                                    placeholder="City"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label>State</label>
                                <input
                                    type="text"
                                    id="state"
                                    placeholder="State"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label>PIN Code</label>
                                <input
                                    type="text"
                                    id="pincode"
                                    placeholder="6 digit PIN"
                                    maxlength="6"
                                    required
                                >
                            </div>

                        </div>


                        <div class="section-title">
                            Payment Method
                        </div>

                        <div class="payment-options">

                            <label class="payment-option active">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="UPI"
                                    checked
                                >
                                <strong>UPI</strong>
                                <span>Google Pay, PhonePe, Paytm etc.</span>
                            </label>

                            <label class="payment-option">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="Card"
                                >
                                <strong>Credit / Debit Card</strong>
                                <span>Secure card payment</span>
                            </label>

                            <label class="payment-option">
                                <input
                                    type="radio"
                                    name="payment"
                                    value="COD"
                                >
                                <strong>Cash on Delivery</strong>
                                <span>Pay when your order arrives</span>
                            </label>

                        </div>

                        <button
                            type="submit"
                            class="place-order-btn"
                        >
                            PLACE ORDER →
                        </button>

                    </form>

                </div>


                <!-- ORDER SUMMARY -->
                <aside class="summary-card">

                    <h2>Order Summary</h2>

                    <div id="summaryItems" class="summary-items"></div>

                    <div class="summary-divider"></div>

                    <div class="summary-item">
                        <span>Subtotal</span>
                        <strong id="subtotal">₹0</strong>
                    </div>

                    <div class="summary-item">
                        <span>Delivery</span>
                        <strong>FREE</strong>
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-total">
                        <span>Total</span>
                        <span id="total">₹0</span>
                    </div>

                    <div class="secure-note">
                        🔒 Demo secure checkout
                    </div>

                </aside>

            </div>

        </div>

    </main>

    <script src="checkout.js"></script>

</body>
</html>
