<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Cyberflix Systems LLP"><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar cyber-nav final-nav"><a class="logo official-logo" href="index.html"><img src="assets/cyberflix-logo.png" alt="Cyberflix Systems LLP"></a><nav class="main-nav"><a href="index.html">Home</a><a href="components.html">Components</a><a href="builder.html">PC Builder</a><a href="cart.html">Cart</a><a class="active" href="checkout.html">Checkout</a></nav></header>
<section class="page-hero"><div class="page-shell"><h1>CHECK <span>OUT.</span></h1><p>Enter your delivery details and confirm your Cyberflix order.</p></div></section>
<main class="page-shell"><div style="display:grid;grid-template-columns:1fr 360px;gap:24px" class="checkout-layout-final"><form class="form-card" id="checkoutForm"><h2>Customer Details</h2><div class="form-grid"><div class="form-group"><label>FULL NAME</label><input id="name" required></div><div class="form-group"><label>MOBILE</label><input id="mobile" inputmode="numeric" maxlength="10" required></div><div class="form-group"><label>EMAIL</label><input id="email" type="email"></div><div class="form-group"><label>CITY</label><input id="city" required></div><div class="form-group"><label>STATE</label><input id="state" required></div><div class="form-group"><label>PINCODE</label><input id="pincode" inputmode="numeric" maxlength="6" required></div><div class="form-group full"><label>FULL ADDRESS</label><textarea id="address" rows="4" required></textarea></div><div class="form-group full"><label>PAYMENT METHOD</label><div style="display:flex;gap:10px;flex-wrap:wrap"><label class="payment-option"><input type="radio" name="payment" value="UPI" checked> UPI</label><label class="payment-option"><input type="radio" name="payment" value="Card"> Card</label><label class="payment-option"><input type="radio" name="payment" value="COD"> Cash on Delivery</label></div></div></div><button class="primary-btn" style="margin-top:20px;width:100%" type="submit">PLACE ORDER</button></form><aside class="summary-card"><h2>Order Summary</h2><div id="summaryItems"></div><hr style="border-color:#222;margin:18px 0"><div style="display:flex;justify-content:space-between"><span>Total</span><strong id="total" style="color:#08B5D9;font-size:25px">₹0</strong></div></aside></div></main><script src="checkout.js"></script></body></html>
